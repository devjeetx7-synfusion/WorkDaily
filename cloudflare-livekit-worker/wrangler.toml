name = "workdaily-livekit-token"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
LIVEKIT_URL = "wss://your-livekit-project.livekit.cloud"
FIREBASE_PROJECT_ID = "workdaily-app"

# Note: LIVEKIT_API_KEY and LIVEKIT_API_SECRET must be set as encrypted secrets:
# wrangler secret put LIVEKIT_API_KEY
# wrangler secret put LIVEKIT_API_SECRET
