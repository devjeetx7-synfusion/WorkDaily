name: Artifact and Cache Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cleanup Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const oneDayAgo = new Date();
            oneDayAgo.setDate(oneDayAgo.getDate() - 1);

            console.log(`Cleaning up artifacts older than ${oneDayAgo.toISOString()}`);

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
            });

            // Sort artifacts by creation date descending (newest first)
            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const latestSuccessfulByArtifactName = {};
            const runsCache = {};

            async function getRunConclusion(runId) {
              if (runsCache[runId] !== undefined) return runsCache[runId];
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                });
                runsCache[runId] = run.conclusion;
                return runsCache[runId];
              } catch (e) {
                console.error(`Failed to get run ${runId}: ${e.message}`);
                return null;
              }
            }

            for (const artifact of artifacts) {
              if (artifact.workflow_run.id === context.runId) {
                continue;
              }

              const conclusion = await getRunConclusion(artifact.workflow_run.id);
              const createdAt = new Date(artifact.created_at);
              const isOld = createdAt < oneDayAgo;

              if (conclusion !== 'success') {
                console.log(`Deleting artifact ${artifact.name} (id: ${artifact.id}) from run with conclusion: ${conclusion}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              } else {
                if (!latestSuccessfulByArtifactName[artifact.name]) {
                  latestSuccessfulByArtifactName[artifact.name] = artifact.id;
                  console.log(`Keeping latest successful artifact: ${artifact.name} (id: ${artifact.id}, created: ${artifact.created_at})`);
                } else if (isOld) {
                  console.log(`Deleting old successful artifact ${artifact.name} (id: ${artifact.id}, created: ${artifact.created_at})`);
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                } else {
                  console.log(`Keeping recent successful artifact: ${artifact.name} (id: ${artifact.id}, created: ${artifact.created_at})`);
                }
              }
            }

      - name: Cleanup Caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const oneDayAgo = new Date();
            oneDayAgo.setDate(oneDayAgo.getDate() - 1);

            console.log(`Cleaning up caches older than ${oneDayAgo.toISOString()}`);

            try {
              const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
                owner,
                repo,
              });

              for (const cache of caches) {
                const lastAccessedAt = new Date(cache.last_accessed_at);
                if (lastAccessedAt < oneDayAgo) {
                  console.log(`Deleting old cache: ${cache.key} (id: ${cache.id}, last accessed: ${cache.last_accessed_at})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (e) {
              console.log(`Error during cache cleanup: ${e.message}. (This might happen if no caches exist)`);
            }
