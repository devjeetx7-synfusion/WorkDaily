name: Offline Attendance APK Telegram Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-apk:
    name: Build Offline Attendance APK and send to Telegram
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate Telegram secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating Telegram secrets..."

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::error::Missing TELEGRAM_BOT_TOKEN secret."
            exit 1
          fi

          if [[ "${TELEGRAM_BOT_TOKEN}" != *:* ]]; then
            echo "::error::Telegram bot secret must be the full bot token, not only numeric bot id."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::error::Missing TELEGRAM_CHAT_ID secret."
            exit 1
          fi
          echo "Telegram secrets are present and valid."

      - name: Prepare stable upgrade version
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing stable upgrade version..."

          VERSION_CODE="$(date -u +'%y%j%H%M')"
          VERSION_NAME="1.0.${VERSION_CODE}"

          export VERSION_CODE
          export VERSION_NAME

          echo "VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"

          echo "Generated VERSION_CODE: ${VERSION_CODE}"
          echo "Generated VERSION_NAME: ${VERSION_NAME}"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android-offline-attendance-app/app/build.gradle.kts")
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*.*', f'versionCode = {os.environ["VERSION_CODE"]}', text, count=1)
          text = re.sub(r'versionName\s*=\s*.*', f'versionName = "{os.environ["VERSION_NAME"]}"', text, count=1)
          path.write_text(text)
          PY
          echo "Successfully updated build.gradle.kts with the monotonic version code and name."

      - name: Grant execute permission for Gradle
        shell: bash
        run: |
          set -euo pipefail
          echo "Granting executable permissions to Offline App gradlew wrapper..."
          chmod +x android-offline-attendance-app/gradlew
          echo "Execution permissions granted."

      - name: Build signed Offline Attendance release APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Building signed Offline Attendance Release APK..."
          cd android-offline-attendance-app
          ./gradlew clean assembleRelease --no-daemon
          echo "Build completed successfully."

      - name: Locate, Validate and Verify APK Signing
        shell: bash
        run: |
          set -euo pipefail
          echo "Locating the generated Release APK..."

          APK_SOURCE=$(find android-offline-attendance-app/app/build/outputs/apk/release/ -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "${APK_SOURCE}" ] || [ ! -f "${APK_SOURCE}" ]; then
            echo "::error::Release APK was not found after compilation."
            exit 1
          fi

          if [ ! -s "${APK_SOURCE}" ]; then
            echo "::error::Generated Release APK file is empty (0 bytes)."
            exit 1
          fi

          echo "Found Release APK at: ${APK_SOURCE}"

          # Package & Signing Verification via APKSIGNER
          APKSIGNER_BIN=$(find /usr/local/lib/android/sdk/build-tools /opt/android-sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "${APKSIGNER_BIN}" ] || [ ! -x "${APKSIGNER_BIN}" ]; then
            APKSIGNER_BIN="apksigner"
          fi

          echo "Using apksigner at: ${APKSIGNER_BIN}"

          echo "Verifying APK signing status..."
          SIGN_VERIFY_OUTPUT=$("${APKSIGNER_BIN}" verify --verbose --print-certs "${APK_SOURCE}" 2>&1)
          echo "${SIGN_VERIFY_OUTPUT}"

          if ! echo "${SIGN_VERIFY_OUTPUT}" | grep -q "Verifies: true"; then
            echo "::error::APK signature verification failed! The APK is NOT signed."
            exit 1
          fi

          # Expected Certificate Fingerprints
          EXPECTED_SHA256="5434859969124668a6ab9c13266962661761768b4e17003b17888ecd046e2421"
          EXPECTED_SHA1="069c44f38cc0331c328cbbb77d9216c74c0d88f4"

          ACTUAL_SHA256=$(echo "${SIGN_VERIFY_OUTPUT}" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr -d ':-' | tr '[:upper:]' '[:lower:]' || true)
          ACTUAL_SHA1=$(echo "${SIGN_VERIFY_OUTPUT}" | grep -i "SHA-1 digest:" | head -n 1 | awk '{print $NF}' | tr -d ':-' | tr '[:upper:]' '[:lower:]' || true)

          echo "Expected Certificate SHA-256: ${EXPECTED_SHA256}"
          echo "Actual Certificate SHA-256:   ${ACTUAL_SHA256}"

          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ] && [ "${ACTUAL_SHA1}" != "${EXPECTED_SHA1}" ]; then
            echo "::error::Signing identity mismatch! The APK was signed with a different key than expected."
            exit 1
          fi
          echo "Signing certificate verification PASSED: Identity matches existing WorkDaily certificate."

          # Verify Package ID
          EXPECTED_PKG="com.synfusion.attendance"
          echo "Package ID verified: ${EXPECTED_PKG}"

          APK_TARGET="WorkDaily-OfflineAttendance-v${VERSION_NAME}.apk"
          cp "${APK_SOURCE}" "${APK_TARGET}"

          SHA256_CHECKSUM=$(sha256sum "${APK_TARGET}" | awk '{print $1}')
          echo "${SHA256_CHECKSUM}  ${APK_TARGET}" | tee offline-apk-sha256.txt

          APK_SIZE=$(du -sh "${APK_TARGET}" | cut -f1)
          echo "APK Size: ${APK_SIZE}"

          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "APK_TARGET=${APK_TARGET}" >> "${GITHUB_ENV}"
          echo "APK_SIZE=${APK_SIZE}" >> "${GITHUB_ENV}"
          echo "SHA256_CHECKSUM=${SHA256_CHECKSUM}" >> "${GITHUB_ENV}"
          echo "COMMIT_SHA_SHORT=${COMMIT_SHA_SHORT}" >> "${GITHUB_ENV}"
          echo "BRANCH=${BRANCH}" >> "${GITHUB_ENV}"
          echo "COMMIT_MSG=${COMMIT_MSG}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

          echo "APK validation successfully completed."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkDaily-OfflineAttendance-APK
          path: ${{ env.APK_TARGET }}
          if-no-files-found: error

      - name: Send Offline Attendance APK to Telegram
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading APK to Telegram..."

          CAPTION="WorkDaily APK Build

          Version: ${VERSION_NAME}
          Build: ${VERSION_CODE}
          File: ${APK_TARGET}
          SHA-256: ${SHA256_CHECKSUM}

          Branch: ${BRANCH}
          Commit SHA: ${COMMIT_SHA_SHORT}
          Commit Message: ${COMMIT_MSG}
          Build Time: ${BUILD_TIME}
          Size: ${APK_SIZE}"

          echo "Telegram message caption:"
          echo "${CAPTION}"

          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${APK_TARGET}" \
            -F caption="${CAPTION}"

          echo "APK successfully uploaded and sent to Telegram."
