name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android-app/gradlew
          cp -r android-app/gradle android-admin-app/
          cp android-app/gradlew android-admin-app/
          chmod +x android-admin-app/gradlew

      - name: Build User Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Build Admin Release APK
        run: |
          cd android-admin-app
          ./gradlew assembleAdminRelease
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Clean up old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts -q '.artifacts[] | select(.name == "user-release-apk" or .name == "admin-release-apk") | .id')
          for id in $artifacts; do
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: user-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 9

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-apk
          path: android-admin-app/app/build/outputs/apk/admin/release/app-admin-release.apk
          retention-days: 1
          compression-level: 9
