name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build User Release
        run: |
          cd android-app
          ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts -q '.artifacts[] | select(.name == "user-release-apk" or .name == "user-release-aab") | .id')
          for id in $artifacts; do
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 9

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: user-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
          compression-level: 9
