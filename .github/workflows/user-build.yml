name: User APK Telegram Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build type (internal or release)'
        required: true
        type: choice
        options:
          - internal
          - release
        default: internal

permissions:
  contents: read

jobs:
  build-user-apk:
    name: Build User APK and send to Telegram
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_ID || secrets.BOT_TOKEN || secrets.BOT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
      KEYSTORE_PATH: ../keystore/default-release.jks
      KEYSTORE_PASSWORD: android
      KEY_ALIAS: androiddebugkey
      KEY_PASSWORD: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate Telegram secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "Missing Telegram bot token secret. Add TELEGRAM_BOT_TOKEN or TELEGRAM_BOT_ID."
            exit 1
          fi

          if [[ "${TELEGRAM_BOT_TOKEN}" != *:* ]]; then
            echo "Telegram bot secret must be the full bot token, not only numeric bot id."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing Telegram chat id secret. Add TELEGRAM_CHAT_ID or CHAT_ID."
            exit 1
          fi

      - name: Verify stable signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/keystore/default-release.jks
          keytool -list \
            -keystore android-app/keystore/default-release.jks \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Prepare stable upgrade version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="$(date -u +'%y%j%H%M')"
          VERSION_NAME="1.0.${VERSION_CODE}"

          export VERSION_CODE
          export VERSION_NAME

          echo "VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"

          echo "VERSION_CODE=${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android-app/app/build.gradle.kts")
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*.*', f'versionCode = {os.environ["VERSION_CODE"]}', text, count=1)
          text = re.sub(r'versionName\s*=\s*.*', f'versionName = "{os.environ["VERSION_NAME"]}"', text, count=1)
          path.write_text(text)
          PY

      - name: Grant execute permission for Gradle
        run: chmod +x android-app/gradlew

      - name: Build signed User APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'internal' }}"
          echo "Building variant: ${BUILD_TYPE}"
          cd android-app
          if [ "${BUILD_TYPE}" = "internal" ]; then
            ./gradlew clean :app:assembleInternal --no-daemon
          else
            ./gradlew clean assembleRelease --no-daemon
          fi

      - name: Prepare APK file
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'internal' }}"

          if [ "${BUILD_TYPE}" = "internal" ]; then
            APK_SOURCE="android-app/app/build/outputs/apk/internal/app-internal.apk"
            APK_TARGET="WorkDaily-User-Internal-v${VERSION_NAME}.apk"
          else
            APK_SOURCE="android-app/app/build/outputs/apk/release/app-release.apk"
            APK_TARGET="WorkDaily-User-v${VERSION_NAME}.apk"
          fi

          test -f "${APK_SOURCE}"
          cp "${APK_SOURCE}" "${APK_TARGET}"
          sha256sum "${APK_TARGET}" | tee user-apk-sha256.txt

          echo "APK_TARGET=${APK_TARGET}" >> "${GITHUB_ENV}"
          echo "APK_SHA256=$(cut -d ' ' -f 1 user-apk-sha256.txt)" >> "${GITHUB_ENV}"

      - name: Upload Internal APK as Artifact
        if: ${{ (github.event.inputs.build_type || 'internal') == 'internal' }}
        uses: actions/upload-artifact@v4
        with:
          name: workdaily-internal-test-ads-apk
          path: WorkDaily-User-Internal-v${{ env.VERSION_NAME }}.apk

      - name: Send User APK to Telegram
        shell: bash
        run: |
          set -euo pipefail

          CAPTION="WorkDaily User APK
          Package: com.dailywork.attedance
          Version: ${VERSION_NAME} (${VERSION_CODE})
          Commit: ${GITHUB_SHA}
          SHA256: ${APK_SHA256}"

          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${APK_TARGET}" \
            -F caption="${CAPTION}"