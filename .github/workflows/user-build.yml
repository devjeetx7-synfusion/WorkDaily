name: User Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-app/release.jks

      - name: Build User Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease \
            -PversionCodeProp=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=../release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Build User Release AAB
        run: |
          cd android-app
          ./gradlew bundleRelease \
            -PversionCodeProp=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=../release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: user-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
