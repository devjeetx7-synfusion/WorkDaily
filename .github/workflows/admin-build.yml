name: Admin Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Copy Gradle Wrapper
        run: |
          cp -r android-app/gradle android-admin-app/
          cp android-app/gradlew android-admin-app/
          chmod +x android-admin-app/gradlew

      - name: Build Admin Release
        run: |
          cd android-admin-app
          ./gradlew assembleAdminRelease bundleAdminRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts -q '.artifacts[] | select(.name == "admin-release-apk" or .name == "admin-release-aab") | .id')
          for id in $artifacts; do
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-apk
          path: android-admin-app/app/build/outputs/apk/admin/release/app-admin-release.apk
          retention-days: 1
          compression-level: 9

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-aab
          path: android-admin-app/app/build/outputs/bundle/admin/release/app-admin-release.aab
          retention-days: 1
          compression-level: 9
