name: Admin Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-admin-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Copy Gradle Wrapper
        run: |
          cp -r android-app/gradle android-admin-app/
          cp android-app/gradlew android-admin-app/
          chmod +x android-admin-app/gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-admin-app/release.jks

      - name: Build Admin Release APK
        run: |
          cd android-admin-app
          ./gradlew assembleAdminRelease \
            -PversionCodeProp=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=../release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Build Admin Release AAB
        run: |
          cd android-admin-app
          ./gradlew bundleAdminRelease \
            -PversionCodeProp=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=../release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-apk
          path: android-admin-app/app/build/outputs/apk/admin/release/app-admin-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-aab
          path: android-admin-app/app/build/outputs/bundle/adminRelease/app-admin-release.aab
