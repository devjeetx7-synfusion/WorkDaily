name: Admin Android Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Copy Gradle Wrapper
        run: |
          cp -r android-app/gradle android-admin-app/
          cp android-app/gradlew android-admin-app/
          chmod +x android-admin-app/gradlew

      - name: Build Admin Release
        run: |
          cd android-admin-app
          ./gradlew assembleAdminRelease bundleAdminRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Checking old release APK artifacts..."

          artifact_ids=$(gh api --paginate "repos/${REPO}/actions/artifacts" \
            -q '.artifacts[] | select(.name == "admin-release-apk" or .name == "admin-release-aab") | .id' || true)

          if [ -z "${artifact_ids}" ]; then
            echo "No old release APK artifacts found."
            exit 0
          fi

          echo "${artifact_ids}" | while read -r artifact_id; do
            if [ -n "${artifact_id}" ]; then
              echo "Deleting artifact ID: ${artifact_id}"
              gh api \
                --method DELETE \
                "repos/${REPO}/actions/artifacts/${artifact_id}"
            fi
          done

          echo "Old release APK artifacts cleanup completed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-apk
          path: android-admin-app/app/build/outputs/apk/admin/release/app-admin-release.apk
          retention-days: 1
          compression-level: 9

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-aab
          path: android-admin-app/app/build/outputs/bundle/admin/release/app-admin-release.aab
          retention-days: 1
          compression-level: 9
